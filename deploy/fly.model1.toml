# Fly.io configuration for Model 1 (Resume-to-Job Matching API)
app = "career-ai-model1-fitnet"
primary_region = "fra"

[build]
  dockerfile = "../model1-fitnet/Dockerfile"

[env]
  PORT = "8000"
  ALLOWED_ORIGIN_REGEX = "^https://.*\\.vercel\\.app$"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
