services:
  model1-fitnet:
    build:
      context: ../model1-fitnet
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000
      - FITNET_API_KEY=${FITNET_API_KEY:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  model2-pathnet:
    build:
      context: ../model2-pathnet
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ALLOWED_ORIGINS=http://localhost:3000
      - PATHNET_API_KEY=${PATHNET_API_KEY:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  webapp:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../webapp:/app
    ports:
      - "3000:3000"
    environment:
      - FITNET_API_URL=http://model1-fitnet:8000
      - PATHNET_API_URL=http://model2-pathnet:8001
      - FITNET_API_KEY=${FITNET_API_KEY:-}
      - PATHNET_API_KEY=${PATHNET_API_KEY:-}
    command: sh -c "npm install && npm run build && npm run start"
    depends_on:
      - model1-fitnet
      - model2-pathnet
