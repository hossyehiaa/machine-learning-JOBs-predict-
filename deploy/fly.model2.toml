# Fly.io configuration for Model 2 (Career Trajectory + 230,333-Roadmap RAG API)
app = "career-ai-model2-pathnet-rag"
primary_region = "fra"

[build]
  dockerfile = "../model2-pathnet/Dockerfile"

[env]
  PORT = "8001"
  ALLOWED_ORIGIN_REGEX = "^https://.*\\.vercel\\.app$"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "35s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
